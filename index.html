<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo AI — Zuiki</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f1ea;--card:#fffdf8;--border:#e4dfd4;--accent:#1a1a1a;--accent2:#c45d3e;--muted:#8a847a;--text:#2a2824;--subtle:#f0ece4;--warn:#a06800;--warnbg:#fff8ee;--warnbd:#f0d8a8;--err:#c44;--ok:#1a6b3c}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--subtle)}::-webkit-scrollbar-thumb{background:#c4bfb4;border-radius:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
header{padding:16px 32px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:14px}
.logo-icon{width:34px;height:34px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.logo span{font-size:17px;font-weight:700;letter-spacing:-.3px}
.steps{display:flex;gap:4px;align-items:center}
.step{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600}
.step-a{background:var(--accent);color:#fff}.step-d{color:var(--accent2)}.step-p{color:var(--muted)}
.step-line{width:20px;height:1px;background:var(--border);display:inline-block}
main{max-width:960px;margin:0 auto;padding:32px 24px 80px}
.btn{padding:10px 22px;border-radius:8px;border:none;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px}
.btn:disabled{cursor:default;opacity:.35}
.btn-p{background:var(--accent);color:#fff}.btn-s{background:var(--subtle);color:var(--text);border:1px solid var(--border)}.btn-d{background:#fee;color:var(--err);border:1px solid #ecc}.btn-g{background:var(--ok);color:#fff}.btn-w{background:#fff3dc;color:#8a5e00;border:1px solid var(--warnbd)}
.field{margin-bottom:16px}.field>label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:14px;color:var(--text);outline:none;font-family:'Outfit',sans-serif}
textarea.inp{resize:vertical;line-height:1.7;white-space:pre-wrap}select.inp{appearance:auto;-webkit-appearance:auto}
.brand-btn{flex:1;padding:14px 20px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;border:1px solid var(--border);background:var(--card);color:var(--text)}.brand-btn.active{border:2px solid var(--accent);background:var(--accent);color:#fff}
.card{background:var(--card);border-radius:14px;border:1px solid var(--border);margin-bottom:12px;overflow:hidden;animation:fadeUp .35s ease forwards}.card-w{border-color:var(--warnbd)}.card-e{border-color:#ecc}
.drop{border:2px dashed var(--border);border-radius:14px;text-align:center;cursor:pointer;transition:all .25s;margin-bottom:24px}.drop:hover,.drop.ov{border-color:var(--accent2);background:#faf5ee}
.tag-t{padding:2px 8px;border-radius:5px;background:var(--subtle);font-size:11px;font-weight:600;color:var(--accent);display:inline-block}
.shim{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--subtle),var(--border),var(--subtle));background-size:200% 100%;animation:shimmer 1.5s infinite;display:inline-block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.mb{padding:10px 16px;border-radius:10px 0 0 10px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid var(--border);border-right:none;background:var(--card);color:var(--text)}.mb.act{border:2px solid var(--accent);background:var(--accent);color:#fff}
.md{padding:10px 8px;border-radius:0 10px 10px 0;font-size:11px;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid var(--border);background:#fff5f5;color:var(--err)}
.alert{background:var(--warnbg);border:1px solid var(--warnbd);border-radius:12px;padding:18px;margin-bottom:18px}
.alert-d{background:#fff0ee;border:1px solid #f0b8a8;border-radius:12px;padding:18px;margin-bottom:18px}
.sbdg{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;padding:6px 14px;background:#fff3dc;border-radius:8px;color:#8a5e00;display:inline-block}
.thumb{border-radius:10px;object-fit:cover;border:1px solid var(--border)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th{padding:10px 14px;text-align:left;font-weight:600;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;background:var(--subtle)}.tbl td{padding:10px 14px;border-bottom:1px solid var(--border)}
.sku{font-family:'JetBrains Mono',monospace;color:var(--accent2);font-weight:600}
.cc{padding:14px;background:var(--subtle);border-radius:10px;margin-bottom:10px;border:1px solid var(--border)}
.cs{padding:3px 10px;background:var(--card);border-radius:6px;border:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent2);display:inline-block;margin:0 8px 4px 0}
.spin{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 12px}
.doubt-box{background:#fffbf0;border:1px solid #f0d8a8;border-radius:10px;padding:14px;margin-top:10px}
.doubt-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;background:#fff3dc;color:#8a5e00;font-size:11px;font-weight:700;letter-spacing:.3px}
.err-box{background:#fff5f5;border:1px solid #ecc;border-radius:10px;padding:12px;margin-top:6px;font-size:12px;color:var(--err)}
.mem-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;background:#e8f5e9;color:var(--ok);font-size:10px;font-weight:600}
.face-thumb{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--border)}.face-thumb-sm{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
.face-add{width:48px;height:48px;border-radius:50%;border:2px dashed var(--border);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--muted);background:var(--card);transition:all .2s}.face-add:hover{border-color:var(--accent2);color:var(--accent2)}
.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;opacity:0;transition:opacity .2s}.lightbox.show{opacity:1}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:12px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}.lightbox-nav:hover{background:rgba(255,255,255,.3)}
.lightbox-close{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.thumb-zoom{cursor:zoom-in;transition:transform .15s}.thumb-zoom:hover{transform:scale(1.05)}
.wizard-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9998;display:flex;align-items:center;justify-content:center}
.wizard-card{background:var(--card);border-radius:20px;max-width:480px;width:90%;max-height:85vh;overflow:hidden;padding:20px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column}
.wizard-img{width:100%;max-height:35vh;object-fit:contain;border-radius:14px;border:1px solid var(--border);margin-bottom:12px;flex-shrink:1;min-height:0}
.wizard-progress{height:4px;background:var(--border);border-radius:2px;margin-bottom:20px;overflow:hidden}.wizard-progress-bar{height:100%;background:var(--accent2);border-radius:2px;transition:width .3s}
.wizard-reworking{text-align:center;padding:40px 20px}
</style>
</head>
<body>
<header>
<div class="logo"><div class="logo-icon">Z</div><span>Catalogo AI</span></div>
<div class="steps" id="si"></div>
</header>
<div class="wizard-overlay" id="wiz" style="display:none"></div>
<div class="lightbox" id="lb" style="display:none" onclick="closeLB(event)">
<button class="lightbox-close" onclick="closeLB()">✕</button>
<button class="lightbox-nav" style="left:16px" onclick="event.stopPropagation();navLB(-1)">‹</button>
<img id="lbImg" src="">
<button class="lightbox-nav" style="right:16px" onclick="event.stopPropagation();navLB(1)">›</button>
</div>
<main id="mn"></main>
<script>
let lbImgs=[],lbIdx=0;
function openLB(imgs,idx){lbImgs=imgs;lbIdx=idx||0;document.getElementById("lbImg").src=lbImgs[lbIdx];const lb=document.getElementById("lb");lb.style.display="flex";requestAnimationFrame(()=>lb.classList.add("show"));}
function closeLB(e){if(e&&e.target.tagName==="IMG")return;const lb=document.getElementById("lb");lb.classList.remove("show");setTimeout(()=>lb.style.display="none",200);}
function navLB(d){lbIdx=(lbIdx+d+lbImgs.length)%lbImgs.length;document.getElementById("lbImg").src=lbImgs[lbIdx];}
document.addEventListener("keydown",e=>{if(document.getElementById("lb").style.display==="flex"){if(e.key==="Escape")closeLB();if(e.key==="ArrowLeft")navLB(-1);if(e.key==="ArrowRight")navLB(1);}});

let wizDoubts=[],wizIdx=0,wizReworking=false;
function openWizard(){
wizDoubts=items.map((it,i)=>({idx:i,it})).filter(x=>x.it.doubt&&!x.it.doubtResolved);
if(!wizDoubts.length)return;
wizIdx=0;wizReworking=false;renderWiz();}

function renderWiz(){
const wiz=document.getElementById("wiz");wiz.style.display="flex";
if(wizReworking){wiz.innerHTML=`<div class="wizard-card wizard-reworking"><div class="spin" style="width:32px;height:32px;margin:0 auto 16px"></div><h3 style="font-size:18px;font-weight:700;margin-bottom:8px">Rielaborazione in corso...</h3><p style="color:var(--muted);font-size:13px">Sto rigenerando titolo, descrizione breve, descrizione lunga e tag per ${wizDoubts.length} prodott${wizDoubts.length>1?"i":"o"}.</p></div>`;return;}
const d=wizDoubts[wizIdx];const it=d.it;const np=wizDoubts.length;
const imgSrc=it.ap?it.ap[0]:it.pv;
wiz.innerHTML=`<div class="wizard-card">
<div class="wizard-progress" style="flex-shrink:0"><div class="wizard-progress-bar" style="width:${((wizIdx+1)/np)*100}%"></div></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-shrink:0">
<span style="font-size:12px;color:var(--muted);font-weight:600">${wizIdx+1} di ${np}</span>
<span class="sku" style="font-size:14px">${it.sku}</span>
<span class="tag-t">${it.tp}</span></div>
<img src="${imgSrc}" class="wizard-img" style="cursor:zoom-in" onclick="openLB(${JSON.stringify(it.ap||[it.pv]).replace(/"/g,'&apos;')},0)">
<div class="doubt-box" style="margin-top:0;margin-bottom:12px;flex-shrink:0">
<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px">
<span style="font-size:16px">🔍</span>
<div><p style="font-size:13px;font-weight:600;color:#8a5e00;margin-bottom:2px">Stampa/Logo da identificare</p>
<p style="font-size:11px;color:var(--muted);line-height:1.3">L'AI ha visto: <em>"${it.doubtDesc}"</em></p></div></div>
<input class="inp" id="wizInput" placeholder="Scrivi le info per chiarire il dubbio..." style="font-size:14px;border-color:#f0d8a8;padding:10px 14px" value="${it.doubtInput||""}" onkeydown="if(event.key==='Enter')wizNext()">
</div>
<div style="display:flex;justify-content:space-between;gap:10px;flex-shrink:0">
${wizIdx>0?`<button class="btn btn-s" onclick="wizPrev()">← Indietro</button>`:'<div></div>'}
<div style="display:flex;gap:8px">
<button class="btn btn-s" onclick="wizSkip()">Ignora</button>
<button class="btn btn-p" onclick="wizNext()">${wizIdx===np-1?"Completa e Rielabora →":"Avanti →"}</button>
</div></div></div>`;
setTimeout(()=>{const inp=document.getElementById("wizInput");if(inp)inp.focus();},100);}

function wizPrev(){if(wizIdx>0){wizSaveInput();wizIdx--;renderWiz();}}
function wizSkip(){const d=wizDoubts[wizIdx];d.it.doubt=false;d.it.doubtResolved=true;wizDoubts.splice(wizIdx,1);if(!wizDoubts.length){closeWiz();render();return;}if(wizIdx>=wizDoubts.length)wizIdx=wizDoubts.length-1;renderWiz();}
function wizSaveInput(){const inp=document.getElementById("wizInput");if(inp)wizDoubts[wizIdx].it.doubtInput=inp.value;}

async function wizNext(){
wizSaveInput();
const d=wizDoubts[wizIdx];const v=d.it.doubtInput?.trim();
if(v){resolveDoubt(d.idx);}else{d.it.doubt=false;d.it.doubtResolved=true;}
if(wizIdx<wizDoubts.length-1){wizIdx++;renderWiz();return;}
// Last one - close wizard, rework with progress bar
const toRework=wizDoubts.filter(d=>d.it.doubtUserInfo);
closeWiz();
if(!toRework.length){procPhase="";render();return;}
procPhase="reworking";rwTotal=toRework.length;rwDone=0;render();
await runPool(toRework,5,async(d)=>{await reworkItem(d.idx);rwDone++;render();});
procPhase="";render();}

function closeWiz(){document.getElementById("wiz").style.display="none";}
const SFX={GB:"Giubbino",GP:"Giubbino Di Pelle",PA:"Pantaloni",PJ:"Jeans",AB:"Abito",MA:"Maglia",FE:"Felpa",TO:"Top",TS:"T-shirt",BO:"Body",GO:"Gonna",GN:"Gonna",MC:"Maglia",SR:"Scarpe",CZ:"Calzini",FR:"Fermacapelli",SC:"Sciarpa",BR:"Borsa",PF:"Portafogli",CV:"Coprispalle",GI:"Giacca",CS:"Casacca",PI:"Piumino",SP:"Spolverino",PE:"Pelliccia",CD:"Cardigan",CA:"Camicia",CJ:"Camicia Di Jeans",SH:"Shorts",SJ:"Shorts Di Jeans",PG:"Pigiama",RG:"Reggiseno",SL:"Slip",LG:"Leggings",CN:"Canotta"};
const TS=["38","40","42","44","46","48","50","52"],TL=["XS","S","M","L","XL","XXL"];
const STG=["Primavera/Estate","Autunno/Inverno"],SCMAP={"Primavera/Estate":"pe","Autunno/Inverno":"ai"};
const COL=["Bianco","Nero","Grigio","Rosso","Blu","Verde","Giallo","Arancione","Rosa","Viola","Marrone","Beige","Azzurro","Bordeaux","Oro","Argento","Panna","Corallo","Turchese","Lilla"];
const SUP=["t-shirt","top","maglia","felpa","camicia","camicia di jeans","giacca","giubbino","giubbino di pelle","cardigan","coprispalle","casacca","piumino","spolverino","pelliccia","body","reggiseno","sciarpa"];
const LSC={Intimo:["loveskin","intimoreggiseni26","intimoslip26","slipbrasiliana26","slipperizoma26","slipvitaalta26","reggisenipushup26","reggisenibralette26","reggisenibalconcino26","intimobody26","intimopigiami26","intimotopecanotte26"],Sporty:["loveskinleggings","loveskinsporty","loveskintop","loveskin"],"Abbigliamento Daily":["loveskin","loveskinbody","loveskintopecanotte","loveskinpantaloni","loveskincompleto","loveskindaily","loveskinmaglietteet-shirt","loveskinfelpe"]};

let cS=JSON.parse(localStorage.getItem("zs")||"{}"),mod=JSON.parse(localStorage.getItem("zm")||"[]"),ak=localStorage.getItem("za")||"",licMem=JSON.parse(localStorage.getItem("zlm")||"{}"),facePh=JSON.parse(localStorage.getItem("zfp")||"{}");
const PWD="S99";
function isAuth(){const d=localStorage.getItem("zauth");if(!d)return false;try{const o=JSON.parse(d);return Date.now()-o.ts<2*24*60*60*1000;}catch{return false;}}
function doAuth(){localStorage.setItem("zauth",JSON.stringify({ts:Date.now()}));}
let step=isAuth()?(ak?0:-1):-2,prevStep=-99,cfg={br:"",st:"",an:"",ds:"",selMods:[],noModel:false,shootType:""},items=[],unk=[],eI=null,corr=[],cD=false,cL=false,nM=false,tmpFaces=[],pwErr=false,tmpNm="",tmpAl="",tmpTs="",tmpTi="",procStart=0,procTimes=[],procPhase="",rwTotal=0,rwDone=0;
let excelWb=null,excelRows=[],excelMap={},excelFileName="";

const pSKU=fn=>fn.replace(/\.[^.]+$/,"").split("__")[0].split("_")[0].toUpperCase();
const gSuf=sku=>{const t=sku.slice(-2),a={...SFX,...cS};return a[t]?{s:t,tipo:a[t]}:{s:null,tipo:null,u:t};};
function syncTipo(it){if(it._synced)return;const a={...SFX,...cS};const newTp=a[it.sf];let changed=false;
if(newTp&&newTp!==it.tp){const oldTp=it.tp;it.tp=newTp;if(it.nm)it.nm=it.nm.replace(oldTp,newTp);changed=true;
if(it.ds){it.ds=it.ds.replace(/\bPantalone Di Jeans\b/gi,"Jeans").replace(/\bpantaloni di jeans\b/gi,"Jeans").replace(/\bPantalone\b/g,"Pantaloni").replace(/\bpantalone\b/g,"pantaloni");}
if(it.dl){it.dl=it.dl.replace(/\bPantalone Di Jeans\b/gi,"Jeans").replace(/\bpantaloni di jeans\b/gi,"Jeans").replace(/\bPantalone\b/g,"Pantaloni").replace(/\bpantalone\b/g,"pantaloni");}}
if(it.st==="done"&&it.ai&&(changed||!it.tg||!it.tg.endsWith(";"))){it.tg=cfg.br==="zuiki"?mTags({ds:cfg.ds,cat:it.ai?.categoria_seo||"",sub:it.ai?.sottocategoria_seo||"",nm:it.nm,lic:it.ai?.licenza&&it.ai.licenza!=="null"?it.ai.licenza:null,tipo:it.tp}):mTagsLoveskin({tipo:it.tp,sfx:it.sf,lic:it.ai?.licenza&&it.ai.licenza!=="null"?it.ai.licenza:null,vestibilita:it.ai?.vestibilita||null,sporty:!!it.ai?.is_sporty});}
if(it.st==="done")it._synced=true;}
const fD=r=>{const d=r.replace(/\D/g,"");return d.length<=2?d:d.length<=4?d.slice(0,2)+"/"+d.slice(2):d.slice(0,2)+"/"+d.slice(2,4)+"/"+d.slice(4,8);};
const cap=s=>s?s.split(" ").map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(" "):"";
const toB=f=>new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.onerror=j;x.readAsDataURL(f);});
const mT=f=>({jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif",bmp:"image/bmp",tiff:"image/tiff",tif:"image/tiff",heic:"image/heic",heif:"image/heif",avif:"image/avif",svg:"image/svg+xml"}[f.name.toLowerCase().split(".").pop()]||f.type||"image/jpeg");
const gTg=tipo=>SUP.some(s=>(tipo||"").toLowerCase().includes(s))?cfg.ts:cfg.ti;
const esc=s=>'"'+(s||"").replace(/"/g,'""')+'"';
function friendlyErr(e){const s=e||"";if(s.includes("401"))return"Chiave API non valida o scaduta. Controlla la API key nelle impostazioni.";if(s.includes("429"))return"Troppe richieste in poco tempo. Attendi qualche secondo e riprova.";if(s.includes("500")||s.includes("529"))return"Problema temporaneo del server AI. Riprova tra poco.";if(s.includes("413")||s.includes("too large")||s.includes("too many images"))return"Le foto sono troppo pesanti o troppe. Prova con meno foto o foto più leggere.";if(s.includes("network")||s.includes("fetch")||s.includes("Failed"))return"Errore di connessione. Controlla la tua connessione internet.";if(s.includes("timeout"))return"La richiesta ha impiegato troppo tempo. Riprova.";if(s.includes("JSON parse"))return"L'AI ha risposto in un formato non valido. Riprova.";if(s.includes("credit")||s.includes("billing"))return"Credito API esaurito. Ricarica il tuo account Anthropic.";return"Errore imprevisto durante l'analisi. Riprova o contatta il supporto.";}

function resizeImg(file,maxW=200){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");const s=Math.min(maxW/img.width,maxW/img.height,1);c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.7));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

function addFacePhoto(modelName){const i=document.createElement("input");i.type="file";i.accept="image/*";i.multiple=true;i.onchange=async()=>{const files=Array.from(i.files);for(const f of files){const d=await resizeImg(f);if(!facePh[modelName])facePh[modelName]=[];facePh[modelName].push(d);if(!tmpFaces.length)tmpFaces=facePh[modelName];}localStorage.setItem("zfp",JSON.stringify(facePh));render();};i.click();}

${m}${knownLic}${modelInfo}${excelInfo}

ATTENZIONE STAMPE/LOGHI/PERSONAGGI: Se vedi QUALSIASI stampa, logo, immagine, disegno, scritta, personaggio, simbolo o decorazione grafica sul capo e NON sei SICURO AL 100% di cosa sia (es: potrebbe essere un personaggio di un cartone, un logo di un brand, un animale di una licenza, una scritta di un marchio), imposta "dubbio_licenza" su true e descrivi in "dubbio_descrizione" ESATTAMENTE cosa vedi nell'immagine (forma, colore, posizione, testo se presente). Non tirare a indovinare: se hai anche il minimo dubbio, segnalalo.

async function cAI(content,retries=0){
const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":ak,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content}]})});
if((r.status===429||r.status===529||r.status>=500)&&retries<6){const delay=Math.pow(2,retries)*3000;console.log(`API ${r.status}, retry ${retries+1} in ${delay/1000}s`);await new Promise(r=>setTimeout(r,delay));return cAI(content,retries+1);}
if(!r.ok){const t=await r.text();throw new Error(`HTTP ${r.status}: ${t.slice(0,200)}`);}
const d=await r.json();if(d.error)throw new Error(d.error.message);return d.content?.map(x=>x.text||"").join("")||"";}

const gr={};for(const f of imgs){const s=pSKU(f.name);(gr[s]=gr[s]||[]).push(f);}
const ex=new Set(items.map(i=>i.sku));
for(const[sku,sf]of Object.entries(gr)){
if(ex.has(sku)){const it=items.find(i=>i.sku===sku);if(it){it.af.push(...sf);it.ap.push(...sf.map(f=>URL.createObjectURL(f)));}continue;}
let{s,tipo,u}=gSuf(sku);
// Auto-resolve unknown suffix from Excel column T
if(!s&&u){const ex=getExcelInfo(sku);if(ex&&ex.tipoArticolo){cS[u]=ex.tipoArticolo;localStorage.setItem("zs",JSON.stringify(cS));s=u;tipo=ex.tipoArticolo;}else if(!unk.find(x=>x.sf===u))unk.push({sf:u,sku,dn:false,vl:""});}
const ex=getExcelInfo(sku);
items.push({id:Math.random(),sku,fl:sf[0],af:sf,pv:URL.createObjectURL(sf[0]),ap:sf.map(f=>URL.createObjectURL(f)),
st:s?"pend":"wait",ai:null,cp:ex?.composizione||"",tg:"",nm:"",ds:"",dl:"",cl:"",tp:tipo||"",sf:s||u||"",er:null,doubt:false,doubtDesc:"",doubtInput:"",doubtResolved:false,
metaTitle:"",metaDesc:"",metaKeys:"",altImg:"",excelInfo:ex||null});}
procPhase="analyzing";render();await runP();}

async function runPool(tasks,conc,fn){let i=0;async function worker(){while(i<tasks.length){const t=tasks[i++];await fn(t);}}await Promise.all(Array.from({length:Math.min(conc,tasks.length)},()=>worker()));}
async function runP(){
const pending=items.filter(i=>i.st==="pend");
if(pending.length){procPhase="analyzing";procStart=Date.now();procTimes=[];}
async function procOne(it,attempt=0){it.st="load";it.er=null;render();
const t0=Date.now();
try{
const exInfo=it.excelInfo||getExcelInfo(it.sku);
const ai=await aImgs(it.af,it.tp,exInfo);it.ai=ai;it.nm=mNm(it.tp,ai);it.cl=ai.colore_madre||"";
if(exInfo?.composizione&&!it.cp)it.cp=exInfo.composizione;
const fIdx=parseInt(ai.foto_frontale_idx)||0;
if(fIdx>0&&fIdx<it.af.length){const ff=it.af.splice(fIdx,1)[0];it.af.unshift(ff);const fp=it.ap.splice(fIdx,1)[0];it.ap.unshift(fp);it.fl=it.af[0];it.pv=it.ap[0];}
// Move still life photos to the end (keep front photo first)
const slIdx=Array.isArray(ai.foto_still_life_indices)?ai.foto_still_life_indices:[];
if(slIdx.length>0&&it.af.length>1){const slSet=new Set(slIdx);const modelPh=[],stillPh=[],modelPp=[],stillPp=[];
for(let pi=0;pi<it.af.length;pi++){if(pi>0&&slSet.has(pi)){stillPh.push(it.af[pi]);stillPp.push(it.ap[pi]);}else{modelPh.push(it.af[pi]);modelPp.push(it.ap[pi]);}}
it.af=[...modelPh,...stillPh];it.ap=[...modelPp,...stillPp];it.fl=it.af[0];it.pv=it.ap[0];}
if(ai.modella_riconosciuta){const recMod=mod.find(ml=>ml.nome.toLowerCase()===ai.modella_riconosciuta.toLowerCase());if(recMod){it.recMod=recMod.nome;it.modelUnknown=false;}else{it.modelUnknown=true;it.recMod=null;}}
else if(cfg.shootType==="model"||cfg.shootType==="mixed"){it.modelUnknown=true;it.recMod=null;}
it.tg=cfg.br==="zuiki"?mTags({ds:cfg.ds,cat:ai.categoria_seo||"",sub:ai.sottocategoria_seo||"",nm:it.nm,lic:ai.licenza&&ai.licenza!=="null"?ai.licenza:null,tipo:it.tp}):mTagsLoveskin({tipo:it.tp,sfx:it.sf,lic:ai.licenza&&ai.licenza!=="null"?ai.licenza:null,vestibilita:ai.vestibilita||null,sporty:!!ai.is_sporty});
it.ds=mDs(ai,it.cp,it.tp,it.recMod);
if(ai.dubbio_licenza){
const dDesc=(ai.dubbio_descrizione||"").toLowerCase().replace(/[^a-z0-9\s]/g,"").trim().slice(0,60);
let memMatch=null;
for(const[k,v]of Object.entries(licMem)){if(dDesc.includes(k)||k.includes(dDesc.slice(0,20))){memMatch=v;break;}}
if(memMatch){ai.licenza=memMatch;ai.dubbio_licenza=false;it.nm=mNm(it.tp,ai);it.doubt=false;it.doubtResolved=true;
if(it.tg){const licTag=memMatch.toLowerCase().replace(/[^a-z0-9]/g,"");if(!it.tg.includes(licTag))it.tg+="; "+licTag+"; licenza; licenza"+cfg.an;}}
else{it.doubt=true;it.doubtDesc=ai.dubbio_descrizione||"Stampa/logo non identificato";it.doubtResolved=false;}}
else{it.doubt=false;it.doubtResolved=false;}
try{it.dl=await genLong(it);}catch(e){it.dl="[Errore generazione descrizione lunga: "+e.message+"]";}
// Generate meta fields
it.metaTitle=genMetaTitle(it);it.metaDesc=genMetaDesc(it);it.metaKeys=genMetaKeys(it);
// Generate alt image description
try{it.altImg=await genAltImg(it);}catch(e){it.altImg=it.nm+" - "+it.cl;}
it.st="done";procTimes.push(Date.now()-t0);
}catch(e){if(attempt<2){console.log(`Auto-retry ${it.sku} (attempt ${attempt+1}):`,e.message);await new Promise(r=>setTimeout(r,3000*(attempt+1)));return procOne(it,attempt+1);}
it.st="err";it.er=e.message;procTimes.push(Date.now()-t0);}render();}
await runPool(pending,2,it=>procOne(it));
procStart=0;
const pendingDoubts=items.filter(i=>i.doubt&&!i.doubtResolved);
if(pendingDoubts.length){procPhase="";render();setTimeout(()=>openWizard(),400);}
else{procPhase="";render();}}

function parseExcel(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];const json=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});excelWb=wb;excelRows=json;excelMap={};excelFileName=file.name;
// Map SKU (col A=0) to row data, starting from row 2 (index 1)
for(let i=1;i<json.length;i++){const row=json[i];const sku=(row[0]||"").toString().trim().toUpperCase();if(sku)excelMap[sku]={row:i,codice:sku,colori:(row[2]||"").toString(),anno:(row[16]||"").toString(),stagione:(row[17]||"").toString(),tipoArticolo:(row[19]||"").toString(),brand:(row[20]||"").toString(),caratteristica:(row[21]||"").toString(),composizione:(row[27]||"").toString()};}
res({rows:json.length-1,matched:Object.keys(excelMap).length});}catch(err){rej(err);}};r.onerror=rej;r.readAsArrayBuffer(file);});}

function convertToPng(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=img.width;c.height=img.height;c.getContext("2d").drawImage(img,0,0);c.toBlob(blob=>{if(blob)res(blob);else rej(new Error("toBlob failed"));},"image/png");};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

dz.ondragover=e=>{e.preventDefault();dz.classList.add("ov");};
dz.ondragleave=()=>dz.classList.remove("ov");
dz.ondrop=e=>{e.preventDefault();dz.classList.remove("ov");procF(e.dataTransfer.files);};}

function rExp(m,anim){const done=items.filter(i=>i.st==="done");
let cH="";
if(cL)cH=`<div style="text-align:center;padding:30px"><div class="spin"></div><p style="font-size:13px;color:var(--muted);animation:pulse 1s infinite">Analisi correlazioni in corso...</p></div>`;
else if(corr.length)cH=corr.map(cr=>`<div class="cc"><div style="font-size:14px;font-weight:600;margin-bottom:6px">${cr.outfit_name||"Outfit"}</div><div style="margin-bottom:6px">${(cr.skus||[]).map(s=>`<span class="cs">${s}</span>`).join("")}</div><p style="font-size:12px;color:var(--muted)">${cr.motivo||""}</p></div>`).join("");
else if(cD&&!corr.length)cH='<p style="color:var(--muted);font-size:13px;text-align:center;padding:20px">Nessun match visivo trovato.</p>';
const tR=done.map(i=>{const cr=corr.filter(c=>(c.skus||[]).includes(i.sku)).flatMap(c=>(c.skus||[]).filter(s=>s!==i.sku));return`<tr><td class="sku">${i.sku}</td><td>${i.nm}</td><td>${i.tp}</td><td>${i.cl}</td><td style="max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(i.metaTitle||"").replace(/"/g,"&quot;")}">${i.metaTitle||"—"}</td><td>${i.ap?.length||1}</td><td style="font-family:'JetBrains Mono',monospace;font-size:11px">${cr.join("; ")||"—"}</td></tr>`;}).join("");
m.innerHTML=`<div style="${anim?"animation:fadeUp .4s ease forwards":""}">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px">
<div><h2 style="font-size:24px;font-weight:700">Correlazioni & Export</h2><p style="color:var(--muted);font-size:13px">${done.length} prodotti pronti</p></div>
<button class="btn btn-s" onclick="step=1;render()">← Catalogo</button></div>
<div style="background:var(--card);border-radius:14px;border:1px solid var(--border);padding:24px;margin-bottom:20px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
<div><h3 style="font-size:16px;font-weight:600">Prodotti Correlati</h3><p style="font-size:12px;color:var(--muted);margin-top:2px">Confronto visivo per outfit dallo stesso scatto</p></div>
<button class="btn btn-p" ${done.length<2||cL?"disabled":""} onclick="fCorr()">${cL?"Analisi...":cD?"Ricalcola":"Trova Correlazioni"}</button></div>${cH}</div>
<div style="background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:20px">
<div style="padding:14px 20px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600">Anteprima</div>
<div style="overflow-x:auto"><table class="tbl"><thead><tr>${["SKU","Nome","Tipo","Colore","Meta Titolo","Foto","Correlati"].map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${tR}</tbody></table></div></div>
<div style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap">
${excelWb?`<button class="btn btn-g" ${done.length?"":"disabled"} style="padding:14px 40px;font-size:15px;border-radius:12px" onclick="exportExcel()">📊 Scarica Excel (${done.length} prodotti)</button>`
:`<button class="btn btn-g" ${done.length?"":"disabled"} style="padding:14px 40px;font-size:15px;border-radius:12px" onclick="expCSV()">⬇ Scarica CSV (${done.length} prodotti)</button>`}
<button class="btn btn-p" ${done.length?"":"disabled"} style="padding:14px 40px;font-size:15px;border-radius:12px" id="dlPhotosBtn" onclick="this.disabled=true;this.textContent='Preparazione ZIP...';downloadPhotos().then(()=>{this.disabled=false;this.textContent='📸 Scarica Foto Rinominate';}).catch(e=>{this.disabled=false;this.textContent='📸 Scarica Foto Rinominate';alert('Errore: '+e.message);})">📸 Scarica Foto Rinominate</button>
</div></div>`;}

render();
</script>
</body>
</html>
