<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo AI — Zuiki</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f1ea;--card:#fffdf8;--border:#e4dfd4;--accent:#1a1a1a;--accent2:#c45d3e;--muted:#8a847a;--text:#2a2824;--subtle:#f0ece4;--warn:#a06800;--warnbg:#fff8ee;--warnbd:#f0d8a8;--err:#c44;--ok:#1a6b3c}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--subtle)}::-webkit-scrollbar-thumb{background:#c4bfb4;border-radius:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
header{padding:16px 32px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:14px}
.logo-icon{width:34px;height:34px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.logo span{font-size:17px;font-weight:700;letter-spacing:-.3px}
.steps{display:flex;gap:4px;align-items:center}
.step{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600}
.step-a{background:var(--accent);color:#fff}.step-d{color:var(--accent2)}.step-p{color:var(--muted)}
.step-line{width:20px;height:1px;background:var(--border);display:inline-block}
main{max-width:960px;margin:0 auto;padding:32px 24px 80px}
.btn{padding:10px 22px;border-radius:8px;border:none;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px}
.btn:disabled{cursor:default;opacity:.35}
.btn-p{background:var(--accent);color:#fff}.btn-s{background:var(--subtle);color:var(--text);border:1px solid var(--border)}.btn-d{background:#fee;color:var(--err);border:1px solid #ecc}.btn-g{background:var(--ok);color:#fff}.btn-w{background:#fff3dc;color:#8a5e00;border:1px solid var(--warnbd)}
.field{margin-bottom:16px}.field>label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:14px;color:var(--text);outline:none;font-family:'Outfit',sans-serif}
textarea.inp{resize:vertical;line-height:1.7;white-space:pre-wrap}select.inp{appearance:auto;-webkit-appearance:auto}
.brand-btn{flex:1;padding:14px 20px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;border:1px solid var(--border);background:var(--card);color:var(--text)}.brand-btn.active{border:2px solid var(--accent);background:var(--accent);color:#fff}
.card{background:var(--card);border-radius:14px;border:1px solid var(--border);margin-bottom:12px;overflow:hidden;animation:fadeUp .35s ease forwards}.card-w{border-color:var(--warnbd)}.card-e{border-color:#ecc}
.drop{border:2px dashed var(--border);border-radius:14px;text-align:center;cursor:pointer;transition:all .25s;margin-bottom:24px}.drop:hover,.drop.ov{border-color:var(--accent2);background:#faf5ee}
.tag-t{padding:2px 8px;border-radius:5px;background:var(--subtle);font-size:11px;font-weight:600;color:var(--accent);display:inline-block}
.shim{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--subtle),var(--border),var(--subtle));background-size:200% 100%;animation:shimmer 1.5s infinite;display:inline-block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.mb{padding:10px 16px;border-radius:10px 0 0 10px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid var(--border);border-right:none;background:var(--card);color:var(--text)}.mb.act{border:2px solid var(--accent);background:var(--accent);color:#fff}
.md{padding:10px 8px;border-radius:0 10px 10px 0;font-size:11px;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid var(--border);background:#fff5f5;color:var(--err)}
.alert{background:var(--warnbg);border:1px solid var(--warnbd);border-radius:12px;padding:18px;margin-bottom:18px}
.alert-d{background:#fff0ee;border:1px solid #f0b8a8;border-radius:12px;padding:18px;margin-bottom:18px}
.sbdg{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;padding:6px 14px;background:#fff3dc;border-radius:8px;color:#8a5e00;display:inline-block}
.thumb{border-radius:10px;object-fit:cover;border:1px solid var(--border)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th{padding:10px 14px;text-align:left;font-weight:600;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;background:var(--subtle)}.tbl td{padding:10px 14px;border-bottom:1px solid var(--border)}
.sku{font-family:'JetBrains Mono',monospace;color:var(--accent2);font-weight:600}
.cc{padding:14px;background:var(--subtle);border-radius:10px;margin-bottom:10px;border:1px solid var(--border)}
.cs{padding:3px 10px;background:var(--card);border-radius:6px;border:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent2);display:inline-block;margin:0 8px 4px 0}
.spin{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 12px}
.doubt-box{background:#fffbf0;border:1px solid #f0d8a8;border-radius:10px;padding:14px;margin-top:10px}
.doubt-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;background:#fff3dc;color:#8a5e00;font-size:11px;font-weight:700;letter-spacing:.3px}
.err-box{background:#fff5f5;border:1px solid #ecc;border-radius:10px;padding:12px;margin-top:6px;font-size:12px;color:var(--err)}
.mem-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;background:#e8f5e9;color:var(--ok);font-size:10px;font-weight:600}
</style>
</head>
<body>
<header>
<div class="logo"><div class="logo-icon">Z</div><span>Catalogo AI</span></div>
<div class="steps" id="si"></div>
</header>
<main id="mn"></main>
<script>
const SFX={GB:"Giubbino",GP:"Giubbino Di Pelle",PA:"Pantalone",PJ:"Pantalone Di Jeans",AB:"Abito",MA:"Maglia",FE:"Felpa",TO:"Top",TS:"T-shirt",BO:"Body",GO:"Gonna",GN:"Gonna",MC:"Maglia",SR:"Scarpe",CZ:"Calzini",FR:"Fermacapelli",SC:"Sciarpa",BR:"Borsa",PF:"Portafogli",CV:"Coprispalle",GI:"Giacca",CS:"Casacca",PI:"Piumino",SP:"Spolverino",PE:"Pelliccia",CD:"Cardigan",CA:"Camicia",CJ:"Camicia Di Jeans",SH:"Shorts",SJ:"Shorts Di Jeans",PG:"Pigiama",RG:"Reggiseno",SL:"Slip",LG:"Leggings"};
const TS=["38","40","42","44","46","48","50","52"],TL=["XS","S","M","L","XL","XXL"];
const STG=["Primavera/Estate","Autunno/Inverno"],SCMAP={"Primavera/Estate":"pe","Autunno/Inverno":"ai"};
const COL=["Bianco","Nero","Grigio","Rosso","Blu","Verde","Giallo","Arancione","Rosa","Viola","Marrone","Beige","Azzurro","Bordeaux","Oro","Argento","Panna","Corallo","Turchese","Lilla"];
const SUP=["t-shirt","top","maglia","felpa","camicia","camicia di jeans","giacca","giubbino","giubbino di pelle","cardigan","coprispalle","casacca","piumino","spolverino","pelliccia","body","reggiseno","sciarpa"];
const LSC={Intimo:["loveskin","intimoreggiseni26","intimoslip26","slipbrasiliana26","slipperizoma26","slipvitaalta26","reggisenipushup26","reggisenibralette26","reggisenibalconcino26","intimobody26","intimopigiami26","intimotopecanotte26"],Sporty:["loveskinleggings","loveskinsporty","loveskintop","loveskin"],"Abbigliamento Daily":["loveskin","loveskinbody","loveskintopecanotte","loveskinpantaloni","loveskincompleto","loveskindaily","loveskinmaglietteet-shirt","loveskinfelpe"]};

let cS=JSON.parse(localStorage.getItem("zs")||"{}"),mod=JSON.parse(localStorage.getItem("zm")||"[]"),ak=localStorage.getItem("za")||"",licMem=JSON.parse(localStorage.getItem("zlm")||"{}");
let step=ak?0:-1,cfg={br:"",st:"",an:"",ds:"",nm:"",al:"",ts:"",ti:""},items=[],unk=[],eI=null,corr=[],cD=false,cL=false,nM=false;

const pSKU=fn=>fn.replace(/\.[^.]+$/,"").split("__")[0].split("_")[0].toUpperCase();
const gSuf=sku=>{const t=sku.slice(-2),a={...SFX,...cS};return a[t]?{s:t,tipo:a[t]}:{s:null,tipo:null,u:t};};
const fD=r=>{const d=r.replace(/\D/g,"");return d.length<=2?d:d.length<=4?d.slice(0,2)+"/"+d.slice(2):d.slice(0,2)+"/"+d.slice(2,4)+"/"+d.slice(4,8);};
const cap=s=>s?s.split(" ").map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(" "):"";
const toB=f=>new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.onerror=j;x.readAsDataURL(f);});
const mT=f=>({jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif"}[f.name.toLowerCase().split(".").pop()]||"image/jpeg");
const gTg=tipo=>SUP.some(s=>(tipo||"").toLowerCase().includes(s))?cfg.ts:cfg.ti;
const esc=s=>'"'+(s||"").replace(/"/g,'""')+'"';

function mPr(br,tipo,n){
const m=n>1?`Ti vengono fornite ${n} foto dello STESSO articolo da angolazioni diverse. Usale TUTTE per descrivere meglio. Se una foto ha colore diverso ignorala.`:"Singola foto.";
const knownLic=Object.keys(licMem).length?`\nLICENZE GIÀ NOTE (usa queste se riconosci elementi simili): ${Object.entries(licMem).map(([k,v])=>`"${k}" = ${v}`).join(", ")}`:"";
return`Sei un catalogatore moda per ${br==="zuiki"?"Zuiki":"Loveskin"}.
IMPORTANTE: Questo articolo è "${tipo}". NON cambiare il tipo.
${m}${knownLic}

ATTENZIONE STAMPE/LOGHI/PERSONAGGI: Se vedi QUALSIASI stampa, logo, immagine, disegno, scritta, personaggio, simbolo o decorazione grafica sul capo e NON sei SICURO AL 100% di cosa sia (es: potrebbe essere un personaggio di un cartone, un logo di un brand, un animale di una licenza, una scritta di un marchio), imposta "dubbio_licenza" su true e descrivi in "dubbio_descrizione" ESATTAMENTE cosa vedi nell'immagine (forma, colore, posizione, testo se presente). Non tirare a indovinare: se hai anche il minimo dubbio, segnalalo.

Rispondi SOLO JSON valido (no markdown, no backtick, no testo extra):
{"modello_dettaglio":"2-3 parole MODELLO/VESTIBILITÀ senza tipo articolo e senza colore","dettagli_descrizione":"Dettagli visibili: cuciture, tasche, chiusure, stampe, scollo, maniche, vestibilità. Italiano corretto con punteggiatura. Max 3 frasi. NON iniziare ripetendo il tipo articolo.","licenza":"Personaggio/brand SICURO AL 100% (Disney, Mickey Mouse, Snoopy, Hello Kitty, Marvel ecc.) oppure null se non sei sicuro","dubbio_licenza":true/false,"dubbio_descrizione":"Descrizione dettagliata di cosa vedi: forma, colore, posizione, testo. Solo se dubbio_licenza=true, altrimenti null","colore_madre":"SOLO colore base tra: ${COL.join(", ")}","categoria_seo":"macro minuscolo attaccato","sottocategoria_seo":"sotto minuscolo attaccato"}`;}

function mPrLong(br,tipo,nome,descBreve,colore,licenza,comp){
return`Sei un copywriter SEO esperto di moda per ${br==="zuiki"?"Zuiki":"Loveskin"}.
Scrivi una DESCRIZIONE LUNGA ottimizzata SEO per questo prodotto:
- Tipo: ${tipo}
- Nome: ${nome}
- Colore: ${colore}
- Licenza/Personaggio: ${licenza||"Nessuna"}
- Composizione: ${comp||"Non specificata"}
- Descrizione breve: ${descBreve}

REGOLE:
- Testo di 150-250 parole, fluido e naturale, NON a elenco puntato
- Includi keywords rilevanti per la ricerca (tipo articolo, colore, stagione, brand, licenza se presente)
- Includi consigli di stile e abbinamenti
- Includi occasioni d'uso
- Usa un tono coinvolgente e aspirazionale ma autentico
- Menziona materiali e comfort se noti
- Ottimizza per Google e per AI (risposte dirette a query tipo "cosa indossare con...")
- Scrivi in italiano corretto e scorrevole
- NON usare markdown, elenchi puntati o formattazione speciale
- Rispondi SOLO con il testo della descrizione, nient'altro`;}

async function cAI(content){
const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":ak,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content}]})});
if(!r.ok){const t=await r.text();throw new Error(`HTTP ${r.status}: ${t.slice(0,200)}`);}
const d=await r.json();if(d.error)throw new Error(d.error.message);return d.content?.map(x=>x.text||"").join("")||"";}

async function aImgs(files,tipo){
const c=[];for(const f of files)c.push({type:"image",source:{type:"base64",media_type:mT(f),data:await toB(f)}});
c.push({type:"text",text:mPr(cfg.br,tipo,files.length)});
const raw=await cAI(c);
try{return JSON.parse(raw.replace(/```json|```/g,"").trim());}catch(e){throw new Error(`Risposta AI non valida (JSON parse): ${raw.slice(0,150)}...`);}}

async function genLong(it){
const prompt=mPrLong(cfg.br,it.tp,it.nm,it.ds,it.cl,it.ai?.licenza,it.cp);
return await cAI([{type:"text",text:prompt}]);}

function mTags(o){const sa=`${SCMAP[cfg.st]||"pe"}${cfg.an||"26"}`,t=[];if(o.ds)t.push(o.ds+"donna"+sa);if(o.cat)t.push(o.cat+"donna"+sa);if(o.sub&&o.sub!==o.cat)t.push(o.sub+"donna"+sa);if(o.nm)o.nm.toLowerCase().replace(/[^a-zàèéìòù0-9\s-]/g,"").split(/\s+/).filter(w=>w.length>1).forEach(w=>{if(!t.includes(w))t.push(w);});return t.join("; ");}
function mNm(tipo,ai){const l=ai?.licenza&&ai.licenza!=="null"&&ai.licenza!=null?ai.licenza:"",m=ai?.modello_dettaglio?cap(ai.modello_dettaglio):"";return[tipo,m,l].filter(Boolean).join(" ");}
function mDs(ai,comp,tipo){return`${ai?.dettagli_descrizione||""}\n\nLa modella indossa la taglia IT ${gTg(tipo)}\nL'altezza della modella è ${cfg.al} cm\n\n${comp?`Composizione: ${comp}`:"Composizione:"}`;}

async function procF(files){
const imgs=Array.from(files).filter(f=>f.type.startsWith("image/"));if(!imgs.length)return;
const gr={};for(const f of imgs){const s=pSKU(f.name);(gr[s]=gr[s]||[]).push(f);}
const ex=new Set(items.map(i=>i.sku));
for(const[sku,sf]of Object.entries(gr)){
if(ex.has(sku)){const it=items.find(i=>i.sku===sku);if(it){it.af.push(...sf);it.ap.push(...sf.map(f=>URL.createObjectURL(f)));}continue;}
const{s,tipo,u}=gSuf(sku);
if(!s&&u&&!unk.find(x=>x.sf===u))unk.push({sf:u,sku,dn:false,vl:""});
items.push({id:Math.random(),sku,fl:sf[0],af:sf,pv:URL.createObjectURL(sf[0]),ap:sf.map(f=>URL.createObjectURL(f)),
st:s?"pend":"wait",ai:null,cp:"",tg:"",nm:"",ds:"",dl:"",cl:"",tp:tipo||"",sf:s||u||"",er:null,doubt:false,doubtDesc:"",doubtInput:"",doubtResolved:false});}
render();await runP();}

async function runP(){
for(const it of items.filter(i=>i.st==="pend")){it.st="load";it.er=null;render();
try{
const ai=await aImgs(it.af,it.tp);it.ai=ai;it.nm=mNm(it.tp,ai);it.cl=ai.colore_madre||"";
it.tg=cfg.br==="zuiki"?mTags({ds:cfg.ds,cat:ai.categoria_seo||"",sub:ai.sottocategoria_seo||"",nm:it.nm}):"";
it.ds=mDs(ai,"",it.tp);
if(ai.dubbio_licenza){it.doubt=true;it.doubtDesc=ai.dubbio_descrizione||"Stampa/logo non identificato";it.doubtResolved=false;}
else{it.doubt=false;it.doubtResolved=false;}
// Generate long description
try{it.dl=await genLong(it);}catch(e){it.dl="[Errore generazione descrizione lunga: "+e.message+"]";}
it.st="done";
}catch(e){it.st="err";it.er=e.message;}render();}}

async function resSuf(idx){const u=unk[idx];if(!u.vl.trim())return;cS[u.sf]=u.vl.trim();localStorage.setItem("zs",JSON.stringify(cS));u.dn=true;
items.filter(i=>i.st==="wait"&&i.sf===u.sf).forEach(i=>{i.tp=u.vl.trim();i.st="pend";});render();await runP();}

function resolveDoubt(idx){
const it=items[idx];const v=it.doubtInput?.trim();if(!v)return;
it.ai.licenza=v;it.nm=mNm(it.tp,it.ai);it.doubtResolved=true;it.doubt=false;
// Save to memory
const key=(it.doubtDesc||"").toLowerCase().replace(/[^a-z0-9\s]/g,"").trim().slice(0,60);
if(key){licMem[key]=v;localStorage.setItem("zlm",JSON.stringify(licMem));}
// Regenerate descriptions with new license
it.ds=mDs(it.ai,it.cp,it.tp);
render();
// Regen long desc async
genLong(it).then(dl=>{it.dl=dl;render();}).catch(()=>{});
}

async function retryErrors(){
const errs=items.filter(i=>i.st==="err");
errs.forEach(i=>{i.st="pend";i.er=null;});
render();await runP();}

async function retryOne(idx){
items[idx].st="pend";items[idx].er=null;render();await runP();}

async function fCorr(){
cL=true;cD=false;corr=[];render();
const done=items.filter(i=>i.st==="done");const c=[];
for(const it of done){
try{c.push({type:"image",source:{type:"base64",media_type:mT(it.fl),data:await toB(it.fl)}});}catch{}
c.push({type:"text",text:`[SKU:${it.sku} — ${it.nm} (${it.tp})]`});}
c.push({type:"text",text:`Analizza le foto sopra. Trova articoli che sono stati chiaramente scattati NELLO STESSO SET/OUTFIT (stessa scena, stessa modella, stessi accessori, croppati dallo stesso scatto fotografico).
Rispondi SOLO con JSON valido, senza markdown e senza backtick:
[{"outfit_name":"descrizione breve outfit","skus":["SKU1","SKU2"],"motivo":"perché sono correlati"}]
Se non trovi nessun match, rispondi con: []`});
try{const raw=await cAI(c);corr=JSON.parse(raw.replace(/```json|```/g,"").trim());if(!Array.isArray(corr))corr=[];}
catch(e){console.error("Errore correlazioni:",e);corr=[];}
cL=false;cD=true;render();}

function expCSV(){const done=items.filter(i=>i.st==="done");if(!done.length)return;
const cm={};corr.forEach(cr=>cr.skus.forEach(s=>{const o=cr.skus.filter(x=>x!==s).join(", ");cm[s]=cm[s]?cm[s]+"; "+o:o;}));
let csv="\uFEFF"+"SKU;Nome Prodotto;Tipo Articolo;Colore;Composizione;Descrizione Breve;Descrizione Lunga;Tag SEO;Prodotti Correlati\n";
done.forEach(i=>{csv+=[esc(i.sku),esc(i.nm),esc(i.tp),esc(i.cl),esc(i.cp),esc(i.ds),esc(i.dl),esc(i.tg),esc(cm[i.sku]||"")].join(";")+"\n";});
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
a.download=`catalogo_${cfg.br}_${SCMAP[cfg.st]||""}${cfg.an}_${new Date().toISOString().slice(0,10)}.csv`;a.click();}

function uSt(){document.getElementById("si").innerHTML=["Setup","Catalogo","Export"].map((s,i)=>`<span class="step ${i===step?"step-a":i<step?"step-d":"step-p"}">${s}</span>${i<2?'<span class="step-line"></span>':""}`).join("");}

function render(){uSt();const m=document.getElementById("mn");m.innerHTML="";
if(step===-1)rKey(m);else if(step===0)rSet(m);else if(step===1)rCat(m);else rExp(m);}

function rKey(m){m.innerHTML=`<div style="max-width:480px;margin:60px auto;animation:fadeUp .5s ease forwards"><div style="background:var(--card);border-radius:16px;padding:32px;border:1px solid var(--border)">
<div style="font-size:36px;text-align:center;margin-bottom:16px">🔑</div>
<h2 style="font-size:22px;font-weight:700;text-align:center;margin-bottom:8px">Configurazione API</h2>
<p style="font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px">Inserisci la tua API key Anthropic</p>
<div class="field"><label>API KEY</label><input class="inp" type="password" id="akI" placeholder="sk-ant-..." value="${ak}"></div>
<button class="btn btn-p" style="width:100%;padding:14px;font-size:15px" onclick="ak=document.getElementById('akI').value.trim();if(ak){localStorage.setItem('za',ak);step=0;render();}">Salva e Continua</button>
<p style="font-size:11px;color:var(--muted);text-align:center;margin-top:12px">Salvata solo nel tuo browser</p></div></div>`;}

function rSet(m){
const isSelMod=!nM&&cfg.nm&&mod.find(x=>x.nome===cfg.nm);
if(!mod.length&&!nM&&!cfg.nm)nM=true;
let modelleButtons="";

<div class="field" style="margin-bottom:0"><label>Taglia parte inferiore</label><select class="inp" id="fTI" onchange="cfg.ti=this.value"><option value="">Seleziona...</option>${TS.map(t=>`<option ${cfg.ti===t?"selected":""}>${t}</option>`).join("")}</select></div></div>

<div class="field" style="margin-bottom:0"><label>Taglia parte inferiore</label><input class="inp" value="${cfg.ti}" disabled></div></div>`;}

<div class="field"><label>Data Shooting</label><input class="inp" id="dsInp" placeholder="gg/mm/aaaa" maxlength="10" value="${fD(cfg.ds)}" oninput="var r=this.value.replace(/[^0-9]/g,'').slice(0,8);cfg.ds=r;this.value=fD(r)"></div>

function saveNewModella(){
if(!cfg.nm||!cfg.al){alert("Inserisci nome e altezza della modella");return;}
mod=mod.filter(x=>x.nome!==cfg.nm);
mod.push({nome:cfg.nm,altezza:cfg.al,tagliaSopra:cfg.ts,tagliaSotto:cfg.ti});
localStorage.setItem("zm",JSON.stringify(mod));nM=false;render();}

function rCat(m){
const dc=items.filter(i=>i.st==="done").length,ec=items.filter(i=>i.st==="err").length,doubts=items.filter(i=>i.doubt&&!i.doubtResolved).length,ur=unk.filter(u=>!u.dn);
let uH="";if(ur.length)uH=`<div class="alert"><p style="font-size:13px;font-weight:600;color:var(--warn);margin-bottom:12px">⚠ Suffissi non riconosciuti:</p>${ur.map((u,i)=>{const idx=unk.indexOf(u);return`<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><span class="sbdg">${u.sf}</span><span style="font-size:12px;color:var(--muted);min-width:80px">da ${u.sku}</span><input class="inp" placeholder="Es: Bermuda, Tuta..." style="flex:1;padding:8px 12px;font-size:13px" value="${u.vl}" onblur="unk[${idx}].vl=this.value"><button class="btn btn-p" style="padding:8px 16px;font-size:12px" onclick="resSuf(${idx})">Conferma</button></div>`;}).join("")}</div>`;

// Error banner
let errBanner="";
if(ec>0)errBanner=`<div class="alert-d" style="display:flex;justify-content:space-between;align-items:center">
<div><span style="font-size:13px;font-weight:600;color:var(--err)">❌ ${ec} articol${ec>1?"i":"o"} con errore</span>
<span style="font-size:12px;color:var(--muted);margin-left:8px">Espandi per vedere il dettaglio</span></div>
<button class="btn btn-p" style="padding:8px 18px;font-size:12px" onclick="retryErrors()">🔄 Rilancia tutti (${ec})</button></div>`;

// Doubts banner
let doubtBanner="";
if(doubts>0)doubtBanner=`<div class="alert" style="display:flex;justify-content:space-between;align-items:center">
<div><span class="doubt-badge">⚠ DUBBIO LOGO/IMMAGINE</span>
<span style="font-size:12px;color:var(--muted);margin-left:8px">${doubts} articol${doubts>1?"i":"o"} con stampe/loghi da identificare</span></div></div>`;

let iH=items.map((it,idx)=>{

let sH="";if(it.st==="wait")sH='<span style="font-size:11px;color:var(--warn);font-weight:600">⏳ In attesa</span>';
else if(it.st==="load")sH=`<span style="font-size:11px;color:var(--muted);animation:pulse 1s infinite">Analisi AI (${np} foto)...</span>`;
else if(it.st==="err")sH=`<span style="font-size:11px;color:var(--err);font-weight:600">❌ Errore</span>`;
else if(it.st==="done"&&it.doubt&&!it.doubtResolved)sH='<span class="doubt-badge">⚠ DUBBIO LOGO</span>';
else if(it.st==="done")sH='<span style="font-size:11px;color:var(--ok);font-weight:600">✓</span>';

let mH="";
if(it.st==="done")mH=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px"><div><span style="color:var(--muted)">Nome: </span><strong>${it.nm}</strong></div><div><span style="color:var(--muted)">Colore: </span>${it.cl}</div><div><span style="color:var(--muted)">Comp: </span>${it.cp||"—"}</div></div>`;
if(it.st==="load")mH='<div style="display:flex;gap:10px"><div class="shim" style="width:80px"></div><div class="shim" style="width:100px"></div><div class="shim" style="width:70px"></div></div>';

// Error detail
let errH="";
if(it.st==="err")errH=`<div class="err-box"><p style="font-weight:600;margin-bottom:6px">Dettaglio errore:</p><p style="font-family:'JetBrains Mono',monospace;font-size:11px;word-break:break-all">${it.er||"Errore sconosciuto"}</p><button class="btn btn-p" style="padding:6px 14px;font-size:11px;margin-top:8px" onclick="retryOne(${idx})">🔄 Riprova</button></div>`;

// Doubt box
let dbtH="";

dbtH=`<div class="doubt-box"><div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px">

<p style="font-size:12px;color:var(--muted)">L'AI ha visto: <em>"${it.doubtDesc}"</em></p></div></div>
<div style="display:flex;gap:8px;align-items:center">
<input class="inp" placeholder="Es: Krypto (SuperGirl, Warner Bros)" style="flex:1;padding:8px 12px;font-size:13px;border-color:#f0d8a8" value="${it.doubtInput||""}" onblur="items[${idx}].doubtInput=this.value" onkeydown="if(event.key==='Enter'){items[${idx}].doubtInput=this.value;resolveDoubt(${idx})}">

<button class="btn btn-s" style="padding:8px 12px;font-size:11px;white-space:nowrap" onclick="items[${idx}].doubt=false;items[${idx}].doubtResolved=true;render()">Ignora</button></div></div>`;}

let eH="";if(eI===idx&&it.st==="done"){
const gl=np>1?`<div style="margin-bottom:14px"><label style="display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:8px">Tutte le foto (${np})</label><div style="display:flex;gap:8px;flex-wrap:wrap">${it.ap.map(p=>`<img src="${p}" class="thumb" style="width:64px;height:80px;border-radius:8px">`).join("")}</div></div>`:"";
eH=`<div style="padding:0 16px 16px;border-top:1px solid var(--border);padding-top:16px">${gl}<div class="grid3">

${cfg.br==="loveskin"?`<div class="field"><label>Categoria Loveskin</label><select class="inp" onchange="items[${idx}].tg=(LSC[this.value]||[]).join('; ');render()"><option>Seleziona...</option>${Object.keys(LSC).map(k=>`<option>${k}</option>`).join("")}</select></div>`:""}</div>`;}

const cardClass=it.st==="wait"?"card-w":it.st==="err"?"card-e":"";
return`<div class="card ${cardClass}" style="animation-delay:${idx*.03}s">
<div style="display:flex;gap:16px;padding:16px;align-items:flex-start"><div style="display:flex;gap:4px;flex-shrink:0">${th}</div>

<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="sku" style="font-size:14px">${it.sku}</span>${it.tp?`<span class="tag-t">${it.tp}</span>`:""} ${np>1?`<span style="font-size:10px;color:var(--muted)">📷 ${np}</span>`:""} ${sH}${it.doubtResolved&&it.ai?.licenza?`<span class="mem-badge">🏷 ${it.ai.licenza}</span>`:""}</div>
<div style="display:flex;gap:6px">${it.st==="done"?`<button class="btn btn-s" style="padding:5px 12px;font-size:11px" onclick="eI=eI===${idx}?null:${idx};render()">${eI===idx?"Chiudi":"Modifica"}</button>`:""}<button class="btn btn-d" style="padding:5px 12px;font-size:11px" onclick="items.splice(${idx},1);eI=null;render()">✕</button></div></div>${mH}${errH}${dbtH}</div></div>${eH}</div>`;}).join("");

m.innerHTML=`<div style="animation:fadeUp .4s ease forwards">

${errBanner}${doubtBanner}${uH}
<div class="drop" id="dz" style="padding:${items.length?"18px":"48px"}" onclick="const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=()=>procF(i.files);i.click()">
${!items.length?'<div style="font-size:36px;margin-bottom:8px">📸</div>':""}
<p style="font-size:${items.length?"13px":"15px"};font-weight:${items.length?"400":"600"};color:${items.length?"var(--muted)":"var(--text)"}">Trascina le foto dei prodotti</p></div>${iH}</div>`;
const dz=document.getElementById("dz");
dz.ondragover=e=>{e.preventDefault();dz.classList.add("ov");};
dz.ondragleave=()=>dz.classList.remove("ov");

function rExp(m){const done=items.filter(i=>i.st==="done");
let cH="";

const tR=done.map(i=>{const cr=corr.filter(c=>(c.skus||[]).includes(i.sku)).flatMap(c=>(c.skus||[]).filter(s=>s!==i.sku));return`<tr><td class="sku">${i.sku}</td><td>${i.nm}</td><td>${i.tp}</td><td>${i.cl}</td><td>${i.cp||"—"}</td><td>${i.ap?.length||1}</td><td style="font-family:'JetBrains Mono',monospace;font-size:11px">${cr.join(", ")||"—"}</td></tr>`;}).join("");
m.innerHTML=`<div style="animation:fadeUp .4s ease forwards">

<button class="btn btn-p" ${done.length<2||cL?"disabled":""} onclick="fCorr()">${cL?"Analisi...":cD?"Ricalcola":"Trova Correlazioni"}</button></div>${cH}</div>
<div style="background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:20px">

<div style="overflow-x:auto"><table class="tbl"><thead><tr>${["SKU","Nome","Tipo","Colore","Comp.","Foto","Correlati"].map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${tR}</tbody></table></div></div>
<div style="display:flex;justify-content:center"><button class="btn btn-g" ${done.length?"":"disabled"} style="padding:14px 40px;font-size:15px;border-radius:12px" onclick="expCSV()">⬇ Scarica CSV (${done.length} prodotti)</button></div></div>`;}

render();
</script>
