<html lang="it">
<head>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f1ea;--card:#fffdf8;--border:#e4dfd4;--accent:#1a1a1a;--accent2:#c45d3e;--muted:#8a847a;--text:#2a2824;--subtle:#f0ece4;--warn:#a06800;--warnbg:#fff8ee;--warnbd:#f0d8a8;--err:#c44;--ok:#1a6b3c}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--subtle)}::-webkit-scrollbar-thumb{background:#c4bfb4;border-radius:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
header{padding:16px 32px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:14px}
.logo-icon{width:34px;height:34px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.logo span{font-size:17px;font-weight:700;letter-spacing:-.3px}
.steps{display:flex;gap:4px;align-items:center}
.step{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600}
.step-a{background:var(--accent);color:#fff}.step-d{color:var(--accent2)}.step-p{color:var(--muted)}
.step-line{width:20px;height:1px;background:var(--border);display:inline-block}
main{max-width:960px;margin:0 auto;padding:32px 24px 80px}
.btn{padding:10px 22px;border-radius:8px;border:none;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px}
.btn:disabled{cursor:default;opacity:.35}
.btn-p{background:var(--accent);color:#fff}.btn-s{background:var(--subtle);color:var(--text);border:1px solid var(--border)}.btn-d{background:#fee;color:var(--err);border:1px solid #ecc}.btn-g{background:var(--ok);color:#fff}.btn-w{background:#fff3dc;color:#8a5e00;border:1px solid var(--warnbd)}
.field{margin-bottom:16px}.field>label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:14px;color:var(--text);outline:none;font-family:'Outfit',sans-serif}
textarea.inp{resize:vertical;line-height:1.7;white-space:pre-wrap}select.inp{appearance:auto;-webkit-appearance:auto}
.brand-btn{flex:1;padding:14px 20px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;border:1px solid var(--border);background:var(--card);color:var(--text)}.brand-btn.active{border:2px solid var(--accent);background:var(--accent);color:#fff}
.card{background:var(--card);border-radius:14px;border:1px solid var(--border);margin-bottom:12px;overflow:hidden;animation:fadeUp .35s ease forwards}.card-w{border-color:var(--warnbd)}.card-e{border-color:#ecc}
.drop{border:2px dashed var(--border);border-radius:14px;text-align:center;cursor:pointer;transition:all .25s;margin-bottom:24px}.drop:hover,.drop.ov{border-color:var(--accent2);background:#faf5ee}
.tag-t{padding:2px 8px;border-radius:5px;background:var(--subtle);font-size:11px;font-weight:600;color:var(--accent);display:inline-block}
.shim{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--subtle),var(--border),var(--subtle));background-size:200% 100%;animation:shimmer 1.5s infinite;display:inline-block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.mb{padding:10px 16px;border-radius:10px 0 0 10px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid var(--border);border-right:none;background:var(--card);color:var(--text)}.mb.act{border:2px solid var(--accent);background:var(--accent);color:#fff}
.md{padding:10px 8px;border-radius:0 10px 10px 0;font-size:11px;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid var(--border);background:#fff5f5;color:var(--err)}
.alert{background:var(--warnbg);border:1px solid var(--warnbd);border-radius:12px;padding:18px;margin-bottom:18px}
.alert-d{background:#fff0ee;border:1px solid #f0b8a8;border-radius:12px;padding:18px;margin-bottom:18px}
.sbdg{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;padding:6px 14px;background:#fff3dc;border-radius:8px;color:#8a5e00;display:inline-block}
.thumb{border-radius:10px;object-fit:cover;border:1px solid var(--border)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th{padding:10px 14px;text-align:left;font-weight:600;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;background:var(--subtle)}.tbl td{padding:10px 14px;border-bottom:1px solid var(--border)}
.sku{font-family:'JetBrains Mono',monospace;color:var(--accent2);font-weight:600}
.cc{padding:14px;background:var(--subtle);border-radius:10px;margin-bottom:10px;border:1px solid var(--border)}

.spin{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 12px}
.doubt-box{background:#fffbf0;border:1px solid #f0d8a8;border-radius:10px;padding:14px;margin-top:10px}
.doubt-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;background:#fff3dc;color:#8a5e00;font-size:11px;font-weight:700;letter-spacing:.3px}
.err-box{background:#fff5f5;border:1px solid #ecc;border-radius:10px;padding:12px;margin-top:6px;font-size:12px;color:var(--err)}

.face-thumb{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--border)}.face-thumb-sm{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
.face-add{width:48px;height:48px;border-radius:50%;border:2px dashed var(--border);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--muted);background:var(--card);transition:all .2s}.face-add:hover{border-color:var(--accent2);color:var(--accent2)}
.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;opacity:0;transition:opacity .2s}.lightbox.show{opacity:1}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:12px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}.lightbox-nav:hover{background:rgba(255,255,255,.3)}
.lightbox-close{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.thumb-zoom{cursor:zoom-in;transition:transform .15s}.thumb-zoom:hover{transform:scale(1.05)}

<main id="mn"></main>
<script>
let lbImgs=[],lbIdx=0;
function openLB(imgs,idx){lbImgs=imgs;lbIdx=idx||0;document.getElementById("lbImg").src=lbImgs[lbIdx];const lb=document.getElementById("lb");lb.style.display="flex";requestAnimationFrame(()=>lb.classList.add("show"));}
function closeLB(e){if(e&&e.target.tagName==="IMG")return;const lb=document.getElementById("lb");lb.classList.remove("show");setTimeout(()=>lb.style.display="none",200);}
function navLB(d){lbIdx=(lbIdx+d+lbImgs.length)%lbImgs.length;document.getElementById("lbImg").src=lbImgs[lbIdx];}
document.addEventListener("keydown",e=>{if(document.getElementById("lb").style.display==="flex"){if(e.key==="Escape")closeLB();if(e.key==="ArrowLeft")navLB(-1);if(e.key==="ArrowRight")navLB(1);}});
const SFX={GB:"Giubbino",GP:"Giubbino Di Pelle",PA:"Pantalone",PJ:"Pantalone Di Jeans",AB:"Abito",MA:"Maglia",FE:"Felpa",TO:"Top",TS:"T-shirt",BO:"Body",GO:"Gonna",GN:"Gonna",MC:"Maglia",SR:"Scarpe",CZ:"Calzini",FR:"Fermacapelli",SC:"Sciarpa",BR:"Borsa",PF:"Portafogli",CV:"Coprispalle",GI:"Giacca",CS:"Casacca",PI:"Piumino",SP:"Spolverino",PE:"Pelliccia",CD:"Cardigan",CA:"Camicia",CJ:"Camicia Di Jeans",SH:"Shorts",SJ:"Shorts Di Jeans",PG:"Pigiama",RG:"Reggiseno",SL:"Slip",LG:"Leggings"};
const TS=["38","40","42","44","46","48","50","52"],TL=["XS","S","M","L","XL","XXL"];
const STG=["Primavera/Estate","Autunno/Inverno"],SCMAP={"Primavera/Estate":"pe","Autunno/Inverno":"ai"};
const COL=["Bianco","Nero","Grigio","Rosso","Blu","Verde","Giallo","Arancione","Rosa","Viola","Marrone","Beige","Azzurro","Bordeaux","Oro","Argento","Panna","Corallo","Turchese","Lilla"];
const SUP=["t-shirt","top","maglia","felpa","camicia","camicia di jeans","giacca","giubbino","giubbino di pelle","cardigan","coprispalle","casacca","piumino","spolverino","pelliccia","body","reggiseno","sciarpa"];
const LSC={Intimo:["loveskin","intimoreggiseni26","intimoslip26","slipbrasiliana26","slipperizoma26","slipvitaalta26","reggisenipushup26","reggisenibralette26","reggisenibalconcino26","intimobody26","intimopigiami26","intimotopecanotte26"],Sporty:["loveskinleggings","loveskinsporty","loveskintop","loveskin"],"Abbigliamento Daily":["loveskin","loveskinbody","loveskintopecanotte","loveskinpantaloni","loveskincompleto","loveskindaily","loveskinmaglietteet-shirt","loveskinfelpe"]};

let cS=JSON.parse(localStorage.getItem("zs")||"{}"),mod=JSON.parse(localStorage.getItem("zm")||"[]"),ak=localStorage.getItem("za")||"",licMem=JSON.parse(localStorage.getItem("zlm")||"{}"),facePh=JSON.parse(localStorage.getItem("zfp")||"{}");
const PWD="AldoSimone2026";
function isAuth(){const d=localStorage.getItem("zauth");if(!d)return false;try{const o=JSON.parse(d);return Date.now()-o.ts<2*24*60*60*1000;}catch{return false;}}
function doAuth(){localStorage.setItem("zauth",JSON.stringify({ts:Date.now()}));}
let step=isAuth()?(ak?0:-1):-2,prevStep=-99,cfg={br:"",st:"",an:"",ds:"",selMods:[]},items=[],unk=[],eI=null,corr=[],cD=false,cL=false,nM=false,tmpFaces=[],pwErr=false;

const pSKU=fn=>fn.replace(/\.[^.]+$/,"").split("__")[0].split("_")[0].toUpperCase();
const gSuf=sku=>{const t=sku.slice(-2),a={...SFX,...cS};return a[t]?{s:t,tipo:a[t]}:{s:null,tipo:null,u:t};};
const fD=r=>{const d=r.replace(/\D/g,"");return d.length<=2?d:d.length<=4?d.slice(0,2)+"/"+d.slice(2):d.slice(0,2)+"/"+d.slice(2,4)+"/"+d.slice(4,8);};
const cap=s=>s?s.split(" ").map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(" "):"";
const toB=f=>new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.onerror=j;x.readAsDataURL(f);});
const mT=f=>({jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif"}[f.name.toLowerCase().split(".").pop()]||"image/jpeg");
const gTg=tipo=>SUP.some(s=>(tipo||"").toLowerCase().includes(s))?cfg.ts:cfg.ti;
const esc=s=>'"'+(s||"").replace(/"/g,'""')+'"';
function friendlyErr(e){const s=e||"";if(s.includes("401"))return"Chiave API non valida o scaduta. Controlla la API key nelle impostazioni.";if(s.includes("429"))return"Troppe richieste in poco tempo. Attendi qualche secondo e riprova.";if(s.includes("500")||s.includes("529"))return"Problema temporaneo del server AI. Riprova tra poco.";if(s.includes("413")||s.includes("too large")||s.includes("too many images"))return"Le foto sono troppo pesanti o troppe. Prova con meno foto o foto più leggere.";if(s.includes("network")||s.includes("fetch")||s.includes("Failed"))return"Errore di connessione. Controlla la tua connessione internet.";if(s.includes("timeout"))return"La richiesta ha impiegato troppo tempo. Riprova.";if(s.includes("JSON parse"))return"L'AI ha risposto in un formato non valido. Riprova.";if(s.includes("credit")||s.includes("billing"))return"Credito API esaurito. Ricarica il tuo account Anthropic.";return"Errore imprevisto durante l'analisi. Riprova o contatta il supporto.";}

function resizeImg(file,maxW=200){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");const s=Math.min(maxW/img.width,maxW/img.height,1);c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.7));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

function addFacePhoto(modelName){const i=document.createElement("input");i.type="file";i.accept="image/*";i.multiple=true;i.onchange=async()=>{const files=Array.from(i.files);for(const f of files){const d=await resizeImg(f);if(!facePh[modelName])facePh[modelName]=[];facePh[modelName].push(d);if(!tmpFaces.length)tmpFaces=facePh[modelName];}localStorage.setItem("zfp",JSON.stringify(facePh));render();};i.click();}

function removeFace(modelName,idx){if(facePh[modelName]){facePh[modelName].splice(idx,1);if(!facePh[modelName].length)delete facePh[modelName];localStorage.setItem("zfp",JSON.stringify(facePh));}render();}

function addTmpFace(){const i=document.createElement("input");i.type="file";i.accept="image/*";i.multiple=true;i.onchange=async()=>{for(const f of Array.from(i.files)){const d=await resizeImg(f);tmpFaces.push(d);}render();};i.click();}

function removeTmpFace(idx){tmpFaces.splice(idx,1);render();}

function mPr(br,tipo,n,modelNames){
const m=n>1?`Ti vengono fornite ${n} foto dello STESSO articolo da angolazioni diverse. Usale TUTTE per descrivere meglio. Se una foto ha colore diverso ignorala.`:"Singola foto.";
const knownLic=Object.keys(licMem).length?`\nLICENZE GIÀ NOTE (usa queste se riconosci elementi simili): ${Object.entries(licMem).map(([k,v])=>`"${k}" = ${v}`).join(", ")}`:"";
const modelInfo=modelNames&&modelNames.length?`\nRICONOSCIMENTO MODELLA: Ti sono state fornite foto di riferimento del volto delle modelle PRIMA delle foto del prodotto. Le modelle sono: ${modelNames.join(", ")}. Identifica quale modella indossa il capo confrontando i volti. Inserisci il nome nel campo "modella_riconosciuta". Se non riesci a identificarla, usa null.`:"";
return`Sei un catalogatore moda per ${br==="zuiki"?"Zuiki":"Loveskin"}.
IMPORTANTE: Questo articolo è "${tipo}". NON cambiare il tipo.
${m}${knownLic}${modelInfo}

ATTENZIONE STAMPE/LOGHI/PERSONAGGI: Se vedi QUALSIASI stampa, logo, immagine, disegno, scritta, personaggio, simbolo o decorazione grafica sul capo e NON sei SICURO AL 100% di cosa sia (es: potrebbe essere un personaggio di un cartone, un logo di un brand, un animale di una licenza, una scritta di un marchio), imposta "dubbio_licenza" su true e descrivi in "dubbio_descrizione" ESATTAMENTE cosa vedi nell'immagine (forma, colore, posizione, testo se presente). Non tirare a indovinare: se hai anche il minimo dubbio, segnalalo.

REGOLA COLORE: NON menzionare MAI il colore del prodotto in "dettagli_descrizione". La descrizione va sull'articolo genitore e i figli possono avere colori diversi.

Rispondi SOLO JSON valido (no markdown, no backtick, no testo extra):
{"modello_dettaglio":"2-3 parole MODELLO/VESTIBILITÀ senza tipo articolo e senza colore","dettagli_descrizione":"Dettagli visibili: cuciture, tasche, chiusure, stampe, scollo, maniche, vestibilità. Italiano corretto con punteggiatura. Max 3 frasi. NON iniziare ripetendo il tipo articolo. NON menzionare il colore.","licenza":"Personaggio/brand SICURO AL 100% (Disney, Mickey Mouse, Snoopy, Hello Kitty, Marvel ecc.) oppure null se non sei sicuro","dubbio_licenza":true/false,"dubbio_descrizione":"Descrizione dettagliata di cosa vedi: forma, colore, posizione, testo. Solo se dubbio_licenza=true, altrimenti null","colore_madre":"SOLO colore base tra: ${COL.join(", ")}","categoria_seo":"macro minuscolo attaccato","sottocategoria_seo":"sotto minuscolo attaccato"${modelNames&&modelNames.length?',"modella_riconosciuta":"nome modella o null"':""}}`;}


function mPrLong(br,tipo,nome,descBreve,colore,licenza,comp){
return`Sei un copywriter SEO esperto di moda per ${br==="zuiki"?"Zuiki":"Loveskin"}.
Scrivi una DESCRIZIONE LUNGA ottimizzata SEO per questo prodotto:
- Tipo: ${tipo}
- Nome: ${nome}
- Licenza/Personaggio: ${licenza||"Nessuna"}
- Composizione: ${comp||"Non specificata"}
- Descrizione breve: ${descBreve}

REGOLE:
- Testo di 150-250 parole, fluido e naturale, NON a elenco puntato
- NON MENZIONARE MAI IL COLORE del prodotto. La descrizione va sull'articolo genitore e i figli hanno colori diversi. Evita qualsiasi riferimento a colori specifici.
- Includi keywords rilevanti per la ricerca (tipo articolo, stagione, brand, licenza se presente)
- Includi consigli di stile e abbinamenti
- Includi occasioni d'uso
- Usa un tono coinvolgente e aspirazionale ma autentico
- Menziona materiali e comfort se noti
- Ottimizza per Google e per AI (risposte dirette a query tipo "cosa indossare con...")
- Scrivi in italiano corretto e scorrevole
- NON usare markdown, elenchi puntati o formattazione speciale
- Rispondi SOLO con il testo della descrizione, nient'altro`;}

async function cAI(content){
const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":ak,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content}]})});
if(!r.ok){const t=await r.text();throw new Error(`HTTP ${r.status}: ${t.slice(0,200)}`);}
const d=await r.json();if(d.error)throw new Error(d.error.message);return d.content?.map(x=>x.text||"").join("")||"";}

async function aImgs(files,tipo){
const c=[];
// Add face reference photos for model recognition
const modelNames=[];
for(const ml of mod.filter(x=>cfg.selMods.includes(x.nome))){
const fp=facePh[ml.nome]||[];
if(fp.length){modelNames.push(ml.nome);
c.push({type:"text",text:`[FOTO RIFERIMENTO VOLTO: ${ml.nome}]`});
for(const fd of fp){const b64=fd.split(",")[1]||fd;c.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}});}}}
if(modelNames.length)c.push({type:"text",text:"--- FINE FOTO RIFERIMENTO VOLTI. Le foto seguenti sono del PRODOTTO da catalogare ---"});
for(const f of files)c.push({type:"image",source:{type:"base64",media_type:mT(f),data:await toB(f)}});
c.push({type:"text",text:mPr(cfg.br,tipo,files.length,modelNames)});
const raw=await cAI(c);
try{return JSON.parse(raw.replace(/```json|```/g,"").trim());}catch(e){throw new Error(`Risposta AI non valida (JSON parse): ${raw.slice(0,150)}...`);}}

async function genLong(it){
const prompt=mPrLong(cfg.br,it.tp,it.nm,it.ds,it.cl,it.ai?.licenza,it.cp);
return await cAI([{type:"text",text:prompt}]);}

function mTags(o){const sa=`${SCMAP[cfg.st]||"pe"}${cfg.an||"26"}`,t=[];if(o.ds)t.push(o.ds+"donna"+sa);if(o.cat)t.push(o.cat+"donna"+sa);if(o.sub&&o.sub!==o.cat)t.push(o.sub+"donna"+sa);if(o.nm)o.nm.toLowerCase().replace(/[^a-zàèéìòù0-9\s-]/g,"").split(/\s+/).filter(w=>w.length>1).forEach(w=>{if(!t.includes(w))t.push(w);});
if(o.lic){const licTag=o.lic.toLowerCase().replace(/[^a-z0-9]/g,"");if(licTag&&!t.includes(licTag))t.push(licTag);if(!t.includes("licenza"))t.push("licenza");const licAnno="licenza"+(cfg.an||"26");if(!t.includes(licAnno))t.push(licAnno);}
return t.join("; ");}
function mNm(tipo,ai){const l=ai?.licenza&&ai.licenza!=="null"&&ai.licenza!=null?ai.licenza:"",m=ai?.modello_dettaglio?cap(ai.modello_dettaglio):"";return[tipo,m,l].filter(Boolean).join(" ");}
function mDs(ai,comp,tipo,recModName){
const ml=recModName?mod.find(x=>x.nome===recModName):null;
if(!ml&&cfg.selMods.length===1){const singleMl=mod.find(x=>x.nome===cfg.selMods[0]);if(singleMl){return mDs(ai,comp,tipo,singleMl.nome);}}
const alt=ml?ml.altezza:"";
const tgSopra=ml?ml.tagliaSopra:"";
const tgSotto=ml?ml.tagliaSotto:"";
const tg=SUP.some(s=>(tipo||"").toLowerCase().includes(s))?tgSopra:tgSotto;
const modInfo=ml?`\n\nLa modella indossa la taglia IT ${tg}\nL'altezza della modella è ${alt} cm`:"";
return`${ai?.dettagli_descrizione||""}${modInfo}\n\n${comp?`Composizione: ${comp}`:"Composizione:"}`;}

async function procF(files){
const imgs=Array.from(files).filter(f=>f.type.startsWith("image/"));if(!imgs.length)return;
const gr={};for(const f of imgs){const s=pSKU(f.name);(gr[s]=gr[s]||[]).push(f);}
const ex=new Set(items.map(i=>i.sku));
for(const[sku,sf]of Object.entries(gr)){
if(ex.has(sku)){const it=items.find(i=>i.sku===sku);if(it){it.af.push(...sf);it.ap.push(...sf.map(f=>URL.createObjectURL(f)));}continue;}
const{s,tipo,u}=gSuf(sku);
if(!s&&u&&!unk.find(x=>x.sf===u))unk.push({sf:u,sku,dn:false,vl:""});
items.push({id:Math.random(),sku,fl:sf[0],af:sf,pv:URL.createObjectURL(sf[0]),ap:sf.map(f=>URL.createObjectURL(f)),
st:s?"pend":"wait",ai:null,cp:"",tg:"",nm:"",ds:"",dl:"",cl:"",tp:tipo||"",sf:s||u||"",er:null,doubt:false,doubtDesc:"",doubtInput:"",doubtResolved:false});}
render();await runP();}

async function runP(){
for(const it of items.filter(i=>i.st==="pend")){it.st="load";it.er=null;render();
try{
const ai=await aImgs(it.af,it.tp);it.ai=ai;it.nm=mNm(it.tp,ai);it.cl=ai.colore_madre||"";
// Use recognized model's measurements if available
if(ai.modella_riconosciuta){const recMod=mod.find(ml=>ml.nome.toLowerCase()===ai.modella_riconosciuta.toLowerCase());if(recMod){it.recMod=recMod.nome;}}
it.tg=cfg.br==="zuiki"?mTags({ds:cfg.ds,cat:ai.categoria_seo||"",sub:ai.sottocategoria_seo||"",nm:it.nm,lic:ai.licenza&&ai.licenza!=="null"?ai.licenza:null}):"";
it.ds=mDs(ai,"",it.tp,it.recMod);
if(ai.dubbio_licenza){it.doubt=true;it.doubtDesc=ai.dubbio_descrizione||"Stampa/logo non identificato";it.doubtResolved=false;}
else{it.doubt=false;it.doubtResolved=false;}
// Generate long description
try{it.dl=await genLong(it);}catch(e){it.dl="[Errore generazione descrizione lunga: "+e.message+"]";}
it.st="done";
}catch(e){it.st="err";it.er=e.message;}render();}}

async function resSuf(idx){const u=unk[idx];if(!u.vl.trim())return;cS[u.sf]=u.vl.trim();localStorage.setItem("zs",JSON.stringify(cS));u.dn=true;

it.ai.licenza=v;it.nm=mNm(it.tp,it.ai);it.doubtResolved=true;it.doubt=false;

const key=(it.doubtDesc||"").toLowerCase().replace(/[^a-z0-9\s]/g,"").trim().slice(0,60);

it.reworking=true;render();

Descrizione originale: ${it.ds}
Rispondi SOLO con la nuova descrizione, nient'altro.`;

const allP=JSON.stringify(it.ap||[it.pv]).replace(/"/g,'&quot;');
const th=(it.ap||[it.pv]).slice(0,3).map((p,pi)=>`<img src="${p}" class="thumb thumb-zoom" style="width:${pi?36:72}px;height:${pi?46:90}px;border-radius:${pi?6:10}px" onclick="event.stopPropagation();openLB(${allP.replace(/&quot;/g,"'")},${pi})">`).join("")+(np>3?`<div style="width:36px;height:46px;border-radius:6px;background:var(--subtle);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer" onclick="event.stopPropagation();openLB(${allP.replace(/&quot;/g,"'")},3)">+${np-3}</div>`:"");
let sH="";if(it.st==="wait")sH='<span style="font-size:11px;color:var(--warn);font-weight:600">⏳ In attesa</span>';
else if(it.st==="load")sH=`<span style="font-size:11px;color:var(--muted);animation:pulse 1s infinite">Analisi AI (${np} foto)...</span>`;
else if(it.st==="err")sH=`<span style="font-size:11px;color:var(--err);font-weight:600">❌ Errore</span>`;
else if(it.st==="done"&&it.doubt&&!it.doubtResolved)sH='<span class="doubt-badge">⚠ DUBBIO LOGO</span>';
else if(it.st==="done")sH='<span style="font-size:11px;color:var(--ok);font-weight:600">✓</span>';

let mH="";
if(it.st==="done")mH=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr${it.recMod?" 1fr":""};gap:8px;font-size:12px"><div><span style="color:var(--muted)">Nome: </span><strong>${it.nm}</strong></div><div><span style="color:var(--muted)">Colore: </span>${it.cl}</div><div><span style="color:var(--muted)">Comp: </span>${it.cp||"—"}</div>${it.recMod?`<div><span style="color:var(--muted)">Modella: </span><strong>${it.recMod}</strong></div>`:""}</div>`;
if(it.st==="load")mH='<div style="display:flex;gap:10px"><div class="shim" style="width:80px"></div><div class="shim" style="width:100px"></div><div class="shim" style="width:70px"></div></div>';

// Error detail
let errH="";
if(it.st==="err")errH=`<div class="err-box"><p style="font-weight:600;margin-bottom:6px">${friendlyErr(it.er)}</p><details style="margin-top:6px"><summary style="font-size:10px;color:var(--muted);cursor:pointer">Dettaglio tecnico</summary><p style="font-family:'JetBrains Mono',monospace;font-size:10px;word-break:break-all;margin-top:4px;color:var(--muted)">${it.er||"Errore sconosciuto"}</p></details><button class="btn btn-p" style="padding:6px 14px;font-size:11px;margin-top:8px" onclick="retryOne(${idx})">🔄 Riprova</button></div>`;

// Doubt box
let dbtH="";
if(it.st==="done"&&it.doubt&&!it.doubtResolved){
dbtH=`<div class="doubt-box"><div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px">
<span style="font-size:18px">🔍</span>
<div><p style="font-size:13px;font-weight:600;color:#8a5e00;margin-bottom:4px">Stampa/Logo non identificato con certezza</p>
<p style="font-size:12px;color:var(--muted)">L'AI ha visto: <em>"${it.doubtDesc}"</em></p></div></div>
<div style="display:flex;gap:8px;align-items:center">
<input class="inp" placeholder="Es: Krypto (SuperGirl, Warner Bros)" style="flex:1;padding:8px 12px;font-size:13px;border-color:#f0d8a8" value="${it.doubtInput||""}" onblur="items[${idx}].doubtInput=this.value" onkeydown="if(event.key==='Enter'){items[${idx}].doubtInput=this.value;resolveDoubt(${idx})}">
<button class="btn btn-w" style="padding:8px 16px;font-size:12px;white-space:nowrap" onclick="items[${idx}].doubtInput=items[${idx}].doubtInput||'';resolveDoubt(${idx})">✓ Conferma e Memorizza</button>
<button class="btn btn-s" style="padding:8px 12px;font-size:11px;white-space:nowrap" onclick="items[${idx}].doubt=false;items[${idx}].doubtResolved=true;render()">Ignora</button></div></div>`;}

let eH="";if(eI===idx&&it.st==="done"){
const gl=np>1?`<div style="margin-bottom:14px"><label style="display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:8px">Tutte le foto (${np})</label><div style="display:flex;gap:8px;flex-wrap:wrap">${it.ap.map((p,pi)=>`<img src="${p}" class="thumb thumb-zoom" style="width:64px;height:80px;border-radius:8px" onclick="openLB(${allP.replace(/&quot;/g,"'")},${pi})">`).join("")}</div></div>`:"";
eH=`<div style="padding:0 16px 16px;border-top:1px solid var(--border);padding-top:16px">${gl}<div class="grid3">
<div class="field"><label>Nome Prodotto</label><input class="inp" value="${it.nm}" onblur="items[${idx}].nm=this.value"></div>
<div class="field"><label>Colore Madre</label><select class="inp" onchange="items[${idx}].cl=this.value"><option value="">Seleziona...</option>${COL.map(c=>`<option ${it.cl===c?"selected":""}>${c}</option>`).join("")}</select></div>
<div class="field"><label>Composizione</label><input class="inp" placeholder="es: 100% cotone" value="${it.cp}" onblur="items[${idx}].cp=this.value;items[${idx}].ds=items[${idx}].ds.replace(/Composizione:.*$/s,'Composizione: '+this.value)"></div></div>
<div class="field"><label>Descrizione Breve</label><textarea class="inp" rows="5" style="font-size:13px" onblur="items[${idx}].ds=this.value">${it.ds}</textarea></div>
<div class="field"><label>Descrizione Lunga (SEO)</label><textarea class="inp" rows="8" style="font-size:13px" onblur="items[${idx}].dl=this.value">${it.dl}</textarea><button class="btn btn-s" style="padding:5px 14px;font-size:11px;margin-top:6px" onclick="(async()=>{items[${idx}].dl='Generazione in corso...';render();try{items[${idx}].dl=await genLong(items[${idx}]);}catch(e){items[${idx}].dl='Errore: '+e.message;}render();})()">🔄 Rigenera desc. lunga</button></div>
<div class="field"><label>Tag SEO</label><textarea class="inp" rows="2" style="font-size:12px;font-family:'JetBrains Mono',monospace" onblur="items[${idx}].tg=this.value">${it.tg}</textarea></div>
${cfg.br==="loveskin"?`<div class="field"><label>Categoria Loveskin</label><select class="inp" onchange="items[${idx}].tg=(LSC[this.value]||[]).join('; ');render()"><option>Seleziona...</option>${Object.keys(LSC).map(k=>`<option>${k}</option>`).join("")}</select></div>`:""}</div>`;}

const cardClass=it.st==="wait"?"card-w":it.st==="err"?"card-e":"";
return`<div class="card ${cardClass}" style="animation-delay:${idx*.03}s">
<div style="display:flex;gap:16px;padding:16px;align-items:flex-start"><div style="display:flex;gap:4px;flex-shrink:0">${th}</div>
<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="sku" style="font-size:14px">${it.sku}</span>${it.tp?`<span class="tag-t">${it.tp}</span>`:""} ${np>1?`<span style="font-size:10px;color:var(--muted)">📷 ${np}</span>`:""} ${sH}${it.doubtResolved&&it.ai?.licenza?`<span class="mem-badge">🏷 ${it.ai.licenza}</span>`:""} ${it.reworking?'<span style="font-size:11px;color:var(--muted);animation:pulse 1s infinite">Rielaborazione...</span>':""}</div>
<div style="display:flex;gap:6px">${it.st==="done"&&it.doubtResolved&&it.ai?.licenza&&!it.reworking?`<button class="btn btn-w" style="padding:5px 12px;font-size:11px" onclick="reworkItem(${idx})">🔄 Rielabora</button>`:""} ${it.st==="done"?`<button class="btn btn-s" style="padding:5px 12px;font-size:11px" onclick="eI=eI===${idx}?null:${idx};render()">${eI===idx?"Chiudi":"Modifica"}</button>`:""}<button class="btn btn-d" style="padding:5px 12px;font-size:11px" onclick="items.splice(${idx},1);eI=null;render()">✕</button></div></div>${mH}${errH}${dbtH}</div></div>${eH}</div>`;}).join("");

m.innerHTML=`<div style="${anim?"animation:fadeUp .4s ease forwards":""}">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
<div><h2 style="font-size:24px;font-weight:700">Catalogo Prodotti</h2><p style="color:var(--muted);font-size:13px">${cfg.br==="zuiki"?"Zuiki":"Loveskin"} — ${cfg.st} ${cfg.an} — Donna — ${cfg.selMods.join(", ")} — ${fD(cfg.ds)}</p></div>
<div style="display:flex;gap:10px"><button class="btn btn-s" onclick="step=0;render()">← Setup</button>
<button class="btn btn-g" ${dc?"":"disabled"} onclick="step=2;render()">Correlazioni & Export →</button></div></div>
${errBanner}${doubtBanner}${uH}
<div class="drop" id="dz" style="padding:${items.length?"18px":"48px"}" onclick="const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=()=>procF(i.files);i.click()">
${!items.length?'<div style="font-size:36px;margin-bottom:8px">📸</div>':""}
<p style="font-size:${items.length?"13px":"15px"};font-weight:${items.length?"400":"600"};color:${items.length?"var(--muted)":"var(--text)"}">Trascina le foto dei prodotti</p></div>${iH}</div>`;
const dz=document.getElementById("dz");
dz.ondragover=e=>{e.preventDefault();dz.classList.add("ov");};
dz.ondragleave=()=>dz.classList.remove("ov");
dz.ondrop=e=>{e.preventDefault();dz.classList.remove("ov");procF(e.dataTransfer.files);};}

function rExp(m,anim){const done=items.filter(i=>i.st==="done");
let cH="";
if(cL)cH=`<div style="text-align:center;padding:30px"><div class="spin"></div><p style="font-size:13px;color:var(--muted);animation:pulse 1s infinite">Analisi correlazioni in corso...</p></div>`;
else if(corr.length)cH=corr.map(cr=>`<div class="cc"><div style="font-size:14px;font-weight:600;margin-bottom:6px">${cr.outfit_name||"Outfit"}</div><div style="margin-bottom:6px">${(cr.skus||[]).map(s=>`<span class="cs">${s}</span>`).join("")}</div><p style="font-size:12px;color:var(--muted)">${cr.motivo||""}</p></div>`).join("");
else if(cD&&!corr.length)cH='<p style="color:var(--muted);font-size:13px;text-align:center;padding:20px">Nessun match visivo trovato.</p>';
const tR=done.map(i=>{const cr=corr.filter(c=>(c.skus||[]).includes(i.sku)).flatMap(c=>(c.skus||[]).filter(s=>s!==i.sku));return`<tr><td class="sku">${i.sku}</td><td>${i.nm}</td><td>${i.tp}</td><td>${i.cl}</td><td>${i.cp||"—"}</td><td>${i.ap?.length||1}</td><td style="font-family:'JetBrains Mono',monospace;font-size:11px">${cr.join(", ")||"—"}</td></tr>`;}).join("");
m.innerHTML=`<div style="${anim?"animation:fadeUp .4s ease forwards":""}">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px">
<div><h2 style="font-size:24px;font-weight:700">Correlazioni & Export</h2><p style="color:var(--muted);font-size:13px">${done.length} prodotti pronti</p></div>
<button class="btn btn-s" onclick="step=1;render()">← Catalogo</button></div>
<div style="background:var(--card);border-radius:14px;border:1px solid var(--border);padding:24px;margin-bottom:20px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
<div><h3 style="font-size:16px;font-weight:600">Prodotti Correlati</h3><p style="font-size:12px;color:var(--muted);margin-top:2px">Confronto visivo per outfit dallo stesso scatto</p></div>
<button class="btn btn-p" ${done.length<2||cL?"disabled":""} onclick="fCorr()">${cL?"Analisi...":cD?"Ricalcola":"Trova Correlazioni"}</button></div>${cH}</div>
<div style="background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:20px">
<div style="padding:14px 20px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600">Anteprima</div>
<div style="overflow-x:auto"><table class="tbl"><thead><tr>${["SKU","Nome","Tipo","Colore","Comp.","Foto","Correlati"].map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${tR}</tbody></table></div></div>
<div style="display:flex;justify-content:center"><button class="btn btn-g" ${done.length?"":"disabled"} style="padding:14px 40px;font-size:15px;border-radius:12px" onclick="expCSV()">⬇ Scarica CSV (${done.length} prodotti)</button></div></div>`;}

render();
</script>
</body>
</html>
